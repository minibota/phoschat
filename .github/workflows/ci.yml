name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - os: windows-2022
            qt_arch: win64_msvc2022_64
          - os: macos-15
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cmake --preset debug -DPHOSCHAT_USE_KEYCHAIN=OFF
      - run: cmake --build --preset debug --parallel 2
      - name: Run complete test suite
        if: runner.os != 'macOS'
        run: ctest --preset debug
      - name: Run macOS preview checks
        if: runner.os == 'macOS'
        run: |
          ctest --preset debug -E '^phoschat[.]irc$'
          build/debug/test_irc parsesAndBoundsFrames foldsNamesAndStripsFormatting \
            legacyPlaintextRegistration listsPublicChannels boundsChannelDirectory searchesCuratedDirectory
      - run: cmake --preset release -DBUILD_TESTING=OFF -DPHOSCHAT_USE_KEYCHAIN=OFF
      - run: cmake --build --preset release --parallel 2
      - name: Check private build input validation
        if: runner.os == 'Linux'
        run: python3 tests/test_build_credentials.py
      - name: Configure bundled identity with test-only values
        env:
          PHOSCHAT_TELEGRAM_API_ID: '12345'
          PHOSCHAT_TELEGRAM_API_HASH: '0123456789abcdef0123456789abcdef'
        run: >-
          cmake -S . -B build/bundled -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DPHOSCHAT_USE_KEYCHAIN=OFF -DPHOSCHAT_REQUIRE_TELEGRAM_APP_CREDENTIALS=ON
      - name: Build bundled sign-in tests
        run: cmake --build build/bundled --target test_telegram_credentials test_ui test_core test_account_overview test_irc_accounts --parallel 2
      - name: Test bundled sign-in without network accounts
        run: ctest --test-dir build/bundled --output-on-failure -R '^phoschat[.](telegram_credentials|ui|core|account_overview|irc_accounts)$'
